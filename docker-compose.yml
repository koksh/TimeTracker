version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: time-tracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: time_tracker
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runtime
    image: time-tracker-backend:latest
    container_name: time-tracker-backend
    ports:
      - '3000:3000'
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: time_tracker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: time-tracker-frontend:latest
    container_name: time-tracker-frontend
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  db_data:
